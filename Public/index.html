<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vonnie Treats — Home</title>

  <!-- Importing bakery-style bubble fonts from Google -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Linking the main stylesheet that controls all bakery aesthetics -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>



  <!-- Dark mode toggle button (works across all pages) -->
  <button id="theme_toggler" class="theme-btn">Dark or Light mode</button>

  <!-- ============================================================
       MAIN HEADER SECTION
       Contains the bakery logo, title, and navigation menu.
       Styled with a double border + pastel gradient for a cute bakery feel.
  ============================================================ -->

    <!-- Logo container: holds the uploaded bakery mascot image + title -->
    <div class="logo">
      <img src="images/vonniewebsitepicture.png" alt="Vonnie Treats Logo" class="logo-img">
      <h1>Vonnie Treats</h1>
    </div>

     <div class="account-links">
        <a href="register.html" class="account-btn">Register</a>
        <a href="login.html" class="account-btn">Login</a>
    </div>

    <!-- Menu toggle button for mobile-friendly dropdown navigation -->
     <button id="menu-toggle" class="menu-toggle">Menu</button>

    <!-- Dropdown navigation menu with dessert icons for extra charm -->
   <nav class="dropdown-nav" id="dropdown-nav">
  <a href="index.html">
      <img src="images/brownie.png" class="menu-icon" alt="Home Icon">
      Home
  </a>
  <a href="about.html">
      <img src="images/cupcake.png" class="menu-icon" alt="About Icon">
      About
  </a>
  <a href="contact.html">
      <img src="images/donut.png" class="menu-icon" alt="Contact Icon">
      Contact
  </a>
  <a href="menu.html">
      <img src="images/bundt cake.png" class="menu-icon" alt="Menu Icon">
      Menu
  </a>
  <a href="orderform.html">
      <img src="images/cinnamon roll.png" class="menu-icon" alt="Order Form Icon">
      Order Form
  </a>
  <a href="customerdashboard.html">
      <img src="images/cheesecake.png" class="menu-icon" alt="Dashboard Icon">
      Customer Dashboard
  </a>

</nav>

  <header class="site-header"></header>

  <!-- ============================================================
       MAIN CONTENT WRAPPER
       Centers all homepage content and keeps spacing consistent.
  ============================================================ -->
  <main class="home-wrapper">

    <!-- ============================================================
         WELCOME CARD
         Uses pastel stripes + calling-card border + pastry decorations.
         Introduces visitors to the bakery with warm, friendly text.
    ============================================================ -->
    <section class="home-card pastel-card calling-card">


      <!-- Section title -->
      <h2>Welcome to Vonnie Treats</h2>

      <!-- Introductory bakery description -->
      <p>Fresh pastries, warm flavors, and homemade desserts inspired by family tradition.</p>
      <p>Explore our treats, learn our story, and stay connected as our bakery grows.</p>
    </section>

  <!-- ============================================================
       FOOTER CALLING-CARD
       Styled to match the header and index cards.
       Reinforces brand identity and closes the page visually.
  ============================================================ -->
  <footer class="site-footer">
    © 2026 Vonnie Treats 
  </footer>

  <!-- JavaScript files controlling dark mode + menu toggle -->
  <script src="theme.js"></script>
  <script src="menu.js"></script>

</body>
</html>
