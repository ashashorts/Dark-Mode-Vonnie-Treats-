<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vonnie Treats - Register</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="home-wrapper">

    <section class="home-card calling-card">

        <h2>Create Your Account</h2>

        <form action="/register" method="POST">

            <label for="username">Username</label><br>
            <input type="text"
                   name="username"
                   id="username"
                   required>

            <br><br>

            <label for="email">Email</label><br>
            <input type="email"
                   name="email"
                   id="email"
                   required>

            <br><br>

            <label for="password">Password</label><br>
            <input type="password"
                   name="password"
                   id="password"
                   required>

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

    </section>

</div>

</body>
</html>
